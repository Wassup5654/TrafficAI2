{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register · TrafficAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'website/styles.css' %}">
</head>
<body>

  <div class="navbar">
    <a class="brand" href="/">🚗 TrafficAI</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/dashboard/">Dashboard</a>
      <a href="/login/">Login</a>
      <a href="/register/">Register</a>
    </div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Join TrafficAI and start driving safer today.</p>

      {% if error %}
        <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="post" id="reg-form">
        {% csrf_token %}
        <div class="field">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" placeholder="Jane" required>
        </div>
        <div class="field">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" placeholder="Doe" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone" placeholder="+1 555 000 0000" required>
        </div>
        <div class="field">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" required>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="123 Main St" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-btn">Register</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="/login/">Log in</a></p>
    </div>
  </div>

  <script>
    let form = document.getElementById('reg-form');
    form.addEventListener('submit', function (e) {
      let fname = document.getElementById('fname').value;
      let lname = document.getElementById('lname').value;
      let email = document.getElementById('email').value;
      let password = document.getElementById('password').value;
      let confirmPassword = document.getElementById('confirm-password').value;
      let ph = document.getElementById('phone').value;
      let dob = document.getElementById('dob').value;
      let address = document.getElementById('address').value;

      if (fname === "") { alert("First Name Required!!!"); e.preventDefault(); return; }
      else if (lname === "") { alert("Last Name Required!!!"); e.preventDefault(); return; }
      else if (email === "") { alert("Email Required!!!"); e.preventDefault(); return; }
      else if (password === "") { alert("Password Required!!!"); e.preventDefault(); return; }
      else if (confirmPassword === "") { alert("Confirm Password Required!!!"); e.preventDefault(); return; }
      else if (password != confirmPassword) { alert("Passwords must match!!!"); e.preventDefault(); return; }
      else if (ph === "") { alert("Phone Number Required!!!"); e.preventDefault(); return; }
      else if (dob === "") { alert("Date of Birth Required!!!"); e.preventDefault(); return; }
      else if (address === "") { alert("Address Required!!!"); e.preventDefault(); return; }
      // No preventDefault here — form submits normally to Django via POST
    });
  </script>
</body>
</html>
