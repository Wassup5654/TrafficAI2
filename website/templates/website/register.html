{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Busy Bee Learning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'website/styles.css' %}">
  <style>
    .register-box {
      width: 300px;
      margin: 100px auto;
      padding: 50px;
      background: #00ccff;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      flex-direction: column;
      display: flex;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/dashboard/">Dashboard</a>
      <a href="/login/">Login</a>
      <a href="/register/">Register</a>
      <a class="brand" href="/">TrafficAI 🚗</a>
    </div>
  </div>

  <div class="register-box">
    <h1>Register for TrafficAI</h1>

    {% if error %}
      <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post" id="reg-form">
      {% csrf_token %}
      <label for="fname">First Name:</label>
      <input type="text" id="fname" name="fname" required><br><br>

      <label for="lname">Last Name:</label>
      <input type="text" id="lname" name="lname" required><br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>

      <label for="phone">Phone:</label>
      <input type="text" id="phone" name="phone" required><br><br>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required><br><br>

      <label for="address">Address:</label>
      <input type="text" id="address" name="address" required><br><br>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required><br><br>

      <label for="confirm-password">Confirm Password:</label>
      <input type="password" id="confirm-password" name="confirm-password" required><br><br>


      <input type="submit" value="Register">
    </form>
  </div>

  <script>
    let form = document.getElementById('reg-form');
    form.addEventListener('submit', function (e) {
      let fname = document.getElementById('fname').value;
      let lname = document.getElementById('lname').value;
      let email = document.getElementById('email').value;
      let password = document.getElementById('password').value;
      let confirmPassword = document.getElementById('confirm-password').value;
      let ph = document.getElementById('phone').value;
      let dob = document.getElementById('dob').value;
      let address = document.getElementById('address').value;

      if (fname === "") {
        alert("First Name Required!!!"); e.preventDefault(); return;
      } else if (lname === "") {
        alert("Last Name Required!!!"); e.preventDefault(); return;
      } else if (email === "") {
        alert("Email Required!!!"); e.preventDefault(); return;
      } else if (password === "") {
        alert("Password Required!!!"); e.preventDefault(); return;
      } else if (confirmPassword === "") {
        alert("Confirm Password Required!!!"); e.preventDefault(); return;
      } else if (password != confirmPassword) {
        alert("Passwords must match!!!"); e.preventDefault(); return;
      } else if (ph === "") {
        alert("Phone Number Required!!!"); e.preventDefault(); return;
      } else if (dob === "") {
        alert("Date of Birth Required!!!"); e.preventDefault(); return;
      } else if (address === "") {
        alert("Address Required!!!"); e.preventDefault(); return;
      }
      // No preventDefault here — form submits normally to Django via POST
    });
  </script>
</body>
</html>
